# Tool settings only: adyn runs from its folder with `python main.py`, it is not installed.

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLW"]

[tool.ruff.lint.isort]
known-first-party = [
    "cli",
    "config",
    "core",
]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# The commands are kept one per line, so they read as a table.
"cli/parser.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "cli",
    "config",
    "core",
    "main.py",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"  # leave no .pytest_cache behind
